{% extends "base/base.html" %}
{% load static %}

{% block content %}
<section class="blog-detail-section" style="padding: 60px 0;">
    <div class="container" style="max-width: 800px; margin: 0 auto; padding: 0 20px;">
        
        <!-- Blog Category & Title -->
        <span style="color: #ff9800; font-weight: bold; text-transform: uppercase;">{{ blog.category|default:"Food" }}</span>
        <h1 style="font-size: 32px; margin: 15px 0;">{{ blog.title }}</h1>
        
        <!-- Blog Meta -->
        <div style="color: #666; margin-bottom: 25px; font-size: 14px;">
            <span><i class="fa-regular fa-calendar"></i> {{ blog.created_at|date:"F d, Y" }}</span> &nbsp;|&nbsp;
            <span><i class="fa-regular fa-user"></i> {{ blog.author|default:"Admin" }}</span>
        </div>

        <!-- Blog Image -->
        {% if blog.image %}
            <img src="{{ blog.image.url }}" alt="{{ blog.title }}" style="width: 100%; max-height: 450px; object-fit: cover; border-radius: 12px; margin-bottom: 30px;">
        {% else %}
            <img src="{% static 'images/blog/blog1.jpg' %}" alt="Blog" style="width: 100%; max-height: 450px; object-fit: cover; border-radius: 12px; margin-bottom: 30px;">
        {% endif %}

        <!-- Full Content -->
        <div class="blog-full-content" style="line-height: 1.8; font-size: 16px; color: #333; white-space: pre-line;">
            {{ blog.content }}
        </div>

        <!-- Back Button -->
        <div style="margin-top: 40px;">
            <a href="{% url 'blogs' %}" style="display: inline-block; padding: 10px 20px; background: #000; color: #fff; text-decoration: none; border-radius: 6px;">
                <i class="fa-solid fa-arrow-left"></i> Back to Blogs
            </a>
        </div>

    </div>
</section>
{% endblock %}
