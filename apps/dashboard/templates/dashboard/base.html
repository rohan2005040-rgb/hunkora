{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hunkora Banana Chips{% endblock %}</title>

    <meta name="description" content="{% block description %}Premium Banana Chips{% endblock %}">
    <meta name="keywords" content="{% block keywords %}banana chips, hunkora{% endblock %}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS Files -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/hero.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">

    {% include "base/styles.html" %}
</head>

<body>

<div class="admin-layout">

    {% include 'dashboard/sidebar.html' %}

    <div class="main-content">

        {% include 'dashboard/topbar.html' %}

        <div class="content-body">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{% static 'dashboard/js/dashboard.js' %}"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
